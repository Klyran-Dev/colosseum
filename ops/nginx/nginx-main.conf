worker_processes auto;

error_log /dev/stderr notice;
pid /tmp/nginx/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Defensive capacity controls. Tenant authorization and business quotas
    # remain in the Rust API; these limits protect the edge and downstream
    # pools before a request reaches application code.
    limit_req_zone $binary_remote_addr zone=api_rate:10m rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=api_conn:10m;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /dev/stdout main;
    sendfile on;
    keepalive_timeout 65;

    client_body_temp_path /tmp/nginx/client_temp;
    proxy_temp_path /tmp/nginx/proxy_temp;
    fastcgi_temp_path /tmp/nginx/fastcgi_temp;
    uwsgi_temp_path /tmp/nginx/uwsgi_temp;
    scgi_temp_path /tmp/nginx/scgi_temp;

    include /etc/nginx/conf.d/*.conf;
}
