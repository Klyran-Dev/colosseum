global:
  scrape_interval: 15s
  scrape_timeout: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: [api:8080]
        labels:
          service: api

  - job_name: worker
    metrics_path: /metrics
    static_configs:
      - targets: [worker:8081]
        labels:
          service: worker

  - job_name: indexer
    metrics_path: /metrics
    static_configs:
      - targets: [indexer:8082]
        labels:
          service: indexer

  # The route-verifier profile is optional locally. When enabled, this target
  # exposes finalized refund-funding lease/backlog telemetry; no availability
  # alert is attached unless the deployment explicitly enables the worker.
  - job_name: route-verifier
    metrics_path: /metrics
    static_configs:
      - targets: [route-verifier:8083]
        labels:
          service: route_verifier
