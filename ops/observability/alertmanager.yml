global:
  resolve_timeout: 5m

route:
  group_by: [alertname, service, severity, owner]
  group_wait: 1s
  group_interval: 5s
  repeat_interval: 1h
  receiver: local-evidence

receivers:
  - name: local-evidence
    webhook_configs:
      - url: http://alert-receiver:8086/webhook
        send_resolved: true

inhibit_rules:
  - source_matchers: [severity="critical"]
    target_matchers: [severity="warning"]
    equal: [alertname, service, owner]
