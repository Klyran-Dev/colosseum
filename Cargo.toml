[workspace]
members = [
    "crates/api",
    "crates/auth-service",
    "crates/alert-receiver-fixture",
    "crates/attestation-fixture",
    "crates/indexer",
    "crates/indexer-service",
    "crates/jurisdiction",
    "crates/migration-runner",
    "crates/observability",
    "crates/policy",
    "crates/route-verifier",
    "crates/refund-workflow",
    "crates/rpc-fixture",
    "crates/split-plan",
    "crates/storage",
    "crates/settlement-client",
    "crates/document-payment",
    "crates/fx-evidence",
    "crates/fx-provider",
    "crates/fx-provider-http",
    "crates/fx-signer-http",
    "crates/settlement-adjustments",
    "crates/settlement-coordinator",
    "crates/tax-engine",
    "crates/tax-applicability",
    "crates/tax-engine-service",
    "crates/worker",
    "crates/revenue-streaming",
    "programs/settlement",
]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "UNLICENSED"
rust-version = "1.98.1"

[workspace.dependencies]
async-nats = "=0.50.0"
arc-swap = "=1.9.2"
async-trait = "=0.1.92"
aes-gcm-siv = "=0.11.1"
axum = "=0.8.9"
axum-server = { version = "=0.8.0", features = ["tls-rustls"] }
base64 = "=0.23.1"
getrandom = "=0.3.4"
anchor-lang = "=1.2.0"
anchor-spl = { version = "=1.2.0", features = ["token", "token_2022"] }
deadpool-postgres = { version = "=0.14.2", features = ["with-serde_json-1", "with-uuid-1"] }
ed25519-dalek = "=2.2.0"
indexer = { path = "crates/indexer" }
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls", "http2"] }
rustls = "=0.23.45"
rustls-pemfile = "=2.2.0"
rustls-pki-types = "=1.15.1"
opentelemetry = "=0.33.0"
opentelemetry_sdk = { package = "opentelemetry_sdk", version = "=0.33.0", features = ["trace"] }
opentelemetry-otlp = { version = "=0.33.0", default-features = false, features = ["trace", "grpc-tonic", "tls-ring", "tls-roots"] }
solana-keypair = "=4.0.0"
solana-address-lookup-table-interface = { version = "=4.0.0", features = ["wincode", "bytemuck"] }
solana-message = { version = "=5.1.0", features = ["wincode"] }
solana-pubkey = "=4.4.0"
solana-signature = "=3.6.0"
solana-transaction = { version = "=5.1.0", features = ["verify", "wincode"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
subtle = "=2.6.1"
thiserror = "=2.0.21"
tokio = { version = "=1.53.1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-postgres = "=0.7.18"
tower-http = { version = "=0.7.1", features = ["cors", "limit", "request-id", "trace"] }
tracing = "=0.1.44"
tracing-opentelemetry = "=0.34.0"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "fmt", "json"] }
tower = "=0.5.3"
uuid = { version = "=1.26.1", features = ["serde", "v4", "v7"] }
wincode = "=0.6.1"
x509-parser = "=0.18.1"
