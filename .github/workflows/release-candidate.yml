name: Release candidate evidence

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-candidate:
    name: Build and retain release-candidate evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Install and select pinned Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy --no-self-update
          echo "RUSTUP_TOOLCHAIN=1.98.1" >> "$GITHUB_ENV"
          rustc --version
          cargo --version

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.21.0

      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.3.4 --activate
          node --version
          pnpm --version

      - name: Install locked web dependencies
        run: pnpm --dir apps/web install --frozen-lockfile

      - name: Run repository checks
        run: make check

      - name: Run exact-release authenticated Docker integration
        id: authenticated_integration
        run: |
          set -o pipefail
          mkdir -p release-bundle/integration
          make integration-check 2>&1 | tee release-bundle/integration/evidence.txt
      - name: Bind release integration evidence to source revision
        run: |
          printf 'git_revision=%s\n' "$(git rev-parse HEAD)" > release-bundle/integration/source-revision.txt
      - name: Upload release integration failure evidence
        if: failure() && steps.authenticated_integration.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-integration-failure-${{ github.run_id }}
          path: release-bundle/integration/
          if-no-files-found: error
          retention-days: 30

      - name: Run exact-release browser UI journeys
        run: make web-browser-check
      - name: Bind release browser evidence to source revision
        run: |
          mkdir -p release-bundle/web-e2e
          cp -R test-results/web-e2e/. release-bundle/web-e2e/
          printf 'git_revision=%s\n' "$(git rev-parse HEAD)" > release-bundle/web-e2e/source-revision.txt
      - name: Upload release browser failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-web-e2e-failure-${{ github.run_id }}
          path: test-results/web-e2e/
          if-no-files-found: error
          retention-days: 30

      - name: Run OTLP trace receipt and redaction drill
        env:
          OTEL_TRACE_EVIDENCE_DIR: release-bundle/otel-trace
        run: make otel-trace-drill

      - name: Assert authoritative Linux validator runner
        run: |
          test "$(uname -s)" = Linux
          test "$(docker info --format '{{.OSType}}')" = linux
          case "$(docker info --format '{{.Architecture}}')" in
            amd64|x86_64) ;;
            *) echo "unsupported Docker architecture" >&2; exit 1 ;;
          esac
      - name: Retain authoritative host preflight
        run: ./scripts/verify_solana_conformance_host.sh
      - name: Run validator-backed conformance
        env:
          SOLANA_USE_DOCKER_BUILDER: true
        run: make solana-conformance
      - name: Verify validator conformance evidence
        if: always()
        run: ./scripts/verify_solana_conformance_evidence.sh
      - name: Upload validator failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-validator-conformance-failure-${{ github.run_id }}
          path: test-results/solana-conformance/
          if-no-files-found: error
          retention-days: 30

      - name: Run scheduled vault-reconciliation drill
        run: |
          mkdir -p release-bundle
          make vault-reconciliation-drill | tee release-bundle/vault-reconciliation.txt

      - name: Run multi-provider RPC failover drill
        env:
          VAULT_RECONCILIATION_PROVIDER_MODE: failover
        run: |
          mkdir -p release-bundle
          make vault-reconciliation-drill | tee release-bundle/rpc-failover.txt

      - name: Run lease-fenced refund-funding verifier drill
        env:
          REFUND_FUNDING_VERIFIER_EVIDENCE_DIR: release-bundle/refund-funding-verifier
        run: make refund-funding-verifier-drill

      - name: Run lease-fenced refund-proof candidate ownership drill
        run: |
          mkdir -p release-bundle/refund-proof-lease
          make refund-proof-lease-drill | tee release-bundle/refund-proof-lease/evidence.txt

      - name: Run automated indexer replay recovery drill
        run: |
          make indexer-replay-drill
          mkdir -p release-bundle/indexer-replay
          cp -R test-results/indexer-replay/. release-bundle/indexer-replay/

      - name: Run indexer replay retry-exhaustion drill
        run: |
          make indexer-replay-dead-letter-drill
          mkdir -p release-bundle/indexer-replay-dead-letter
          cp -R test-results/indexer-replay-dead-letter/. release-bundle/indexer-replay-dead-letter/

      - name: Run transaction-bound refund proof drill
        run: |
          mkdir -p release-bundle/refund-proof-integration
          make refund-proof-integration-drill | tee release-bundle/refund-proof-integration/evidence.txt

      - name: Run automated refund-claim cancellation reconciliation drill
        run: |
          make refund-cancellation-reconciliation-drill
          mkdir -p release-bundle/refund-cancellation-reconciliation
          cp -R test-results/refund-cancellation-reconciliation/. release-bundle/refund-cancellation-reconciliation/

      - name: Run Alertmanager delivery drill
        run: |
          make alert-delivery-drill
          mkdir -p release-bundle/alert-delivery
          cp -R test-results/alert-delivery/. release-bundle/alert-delivery/

      - name: Run authenticated refund-execute API contention drill
        run: |
          mkdir -p release-bundle/refund-execute-api-contention
          make refund-execute-api-contention-drill | tee release-bundle/refund-execute-api-contention/evidence.txt

      - name: Run migration integrity drill
        run: |
          mkdir -p release-bundle
          make migration-integrity-drill | tee release-bundle/migration-integrity.txt

      - name: Run migration rollback rehearsal
        run: |
          mkdir -p release-bundle
          make migration-rollback-rehearsal | tee release-bundle/migration-rollback.txt

      - name: Run bounded document-quote latency workload
        run: |
          mkdir -p release-bundle/document-quote-load
          BENCHMARK_RESOURCE_PROFILE_OUTPUT=release-bundle/document-quote-load/resource-profile.ndjson \
            make benchmark-document-quote-service | tee release-bundle/document-quote-load/evidence.txt

      - name: Run encrypted backup artifact drill
        run: |
          mkdir -p release-bundle
          make encrypted-backup-restore-drill | tee release-bundle/encrypted-backup.txt

      - name: Build locked release binaries
        run: cargo build --locked --release --workspace

      - name: Build production web bundle
        run: pnpm --dir apps/web build

      - name: Verify explicit release integrity hashes
        run: make release-bundle-integrity-contract

      - name: Capture security report
        run: |
          mkdir -p release-bundle
          ./scripts/security_scan.sh > release-bundle/security-scan.txt 2>&1

      - name: Generate release SBOM
        run: ./scripts/generate_release_sbom.sh

      - name: Retain Compose and validator metadata
        run: |
          docker compose --profile cache --profile observability --profile indexer --profile route-verifier --profile solana config > release-bundle/compose-config.yml
          cp -R test-results/solana-conformance release-bundle/validator-conformance

      - name: Create and verify release bundle
        env:
          RELEASE_REF: ${{ github.ref_name }}
        run: ./scripts/create_release_bundle.sh

      - name: Upload release-candidate evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-candidate-${{ github.ref_name }}-${{ github.sha }}
          path: release-bundle/
          if-no-files-found: error
          retention-days: 30
