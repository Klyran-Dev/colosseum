name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust format, lint, and tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install and select pinned Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy --no-self-update
          echo "RUSTUP_TOOLCHAIN=1.98.1" >> "$GITHUB_ENV"
          rustc --version
          cargo --version
      - name: Verify formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Verify production Rust panic-safety crate-root contract
        run: make rust-panic-safety-contract
      - name: Test
        run: cargo test --locked --workspace --all-targets

  program-adversarial:
    name: Adversarial settlement account-meta gate
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install and select pinned Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy --no-self-update
          echo "RUSTUP_TOOLCHAIN=1.98.1" >> "$GITHUB_ENV"
          rustc --version
          cargo --version
      - name: Run bounded signed-message property tests
        run: cargo test --locked -p settlement-coordinator --all-targets
      - name: Verify on-chain protocol pause coverage
        run: make program-pause-coverage-contract

  web:
    name: Web tests, typecheck, and build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.21.0
      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.3.4 --activate
          node --version
          pnpm --version
      - name: Install locked dependencies
        run: pnpm --dir apps/web install --frozen-lockfile
      - name: Verify UI contracts
        run: |
          make web-csp-contract
          make web-color-contract
          make ui-language-contract
      - name: Test
        run: pnpm --dir apps/web test
      - name: Accessibility contract
        run: pnpm --dir apps/web exec vitest run src/accessibility.test.tsx
      - name: Typecheck
        run: pnpm --dir apps/web typecheck
      - name: Build
        run: pnpm --dir apps/web build

  web-browser:
    name: Real-browser UI journeys
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Run pinned Docker browser journeys through NGINX
        run: make web-browser-check
      - name: Upload browser failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: web-e2e-${{ github.run_id }}
          path: test-results/web-e2e/
          if-no-files-found: warn
          retention-days: 14

  evm-adapter:
    name: Solidity adapter tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Run pinned Docker Solidity adapter tests
        run: make evm-adapter-check

  compose:
    name: Compose contract
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Validate Compose configuration
        run: docker compose --profile browser --profile cache --profile observability --profile indexer --profile route-verifier --profile solana config --quiet
      - name: Verify immutable image and action pins
        run: make container-pinning-contract
      - name: Validate clean PostgreSQL migration bootstrap
        run: make migration-bootstrap-contract
      - name: Validate Prometheus configuration and alert rules
        run: ./scripts/verify_observability_config.sh
      - name: Build the route-verifier image
        run: docker compose --profile route-verifier build route-verifier
      - name: Build the pinned Tax Engine service image
        run: docker compose build tax-engine

  tax-engine-load:
    name: Bounded Tax Engine service load evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Run the declared warm-service workload
        run: |
          mkdir -p test-results/tax-engine-load
          TAX_ENGINE_BENCHMARK_OUTPUT=test-results/tax-engine-load/summary.json \
            make benchmark-tax-engine-service | tee test-results/tax-engine-load/evidence.txt
      - name: Upload Tax Engine service evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tax-engine-load-${{ github.run_id }}
          path: test-results/tax-engine-load/
          if-no-files-found: warn
          retention-days: 14

  tax-engine-mtls:
    name: Tax Engine container mTLS contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Run the synthetic pinned-image mTLS contract
        run: make tax-engine-mtls-runtime-contract

  tax-engine-auth-rotation:
    name: Tax Engine service-token rotation contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Run the synthetic pinned-image token rotation contract
        run: make tax-engine-runtime-contract

  api-auth-jwks:
    name: API JWKS atomic reload contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Run the synthetic API key-rotation contract
        run: make api-auth-jwks-reload-contract
      - name: Run the synthetic jurisdiction-provider key-rotation contract
        run: make api-jurisdiction-provider-reload-contract

  otel-trace:
    name: OTLP trace receipt and redaction drill
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Run Docker collector receipt drill
        run: make otel-trace-drill
      - name: Upload OTLP trace evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: otel-trace-${{ github.run_id }}
          path: test-results/otel-trace/
          if-no-files-found: warn
          retention-days: 14

  solana-conformance:
    name: Validator-backed settlement conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Assert authoritative Linux validator runner
        run: |
          test "$(uname -s)" = Linux
          test "$(docker info --format '{{.OSType}}')" = linux
          case "$(docker info --format '{{.Architecture}}')" in
            amd64|x86_64) ;;
            *) echo "unsupported Docker architecture" >&2; exit 1 ;;
          esac
      - name: Retain authoritative host preflight
        run: ./scripts/verify_solana_conformance_host.sh
      - name: Run validator-backed conformance
        env:
          SOLANA_USE_DOCKER_BUILDER: true
        run: make solana-conformance
      - name: Verify validator conformance evidence
        if: always()
        run: ./scripts/verify_solana_conformance_evidence.sh
      - name: Upload validator conformance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: solana-conformance-${{ github.run_id }}
          path: test-results/solana-conformance/
          if-no-files-found: error
          retention-days: 14

  security:
    name: Dependency, secret, and Docker security scan
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Run pinned Trivy scan
        run: ./scripts/security_scan.sh

  public-docs:
    name: Public repository documentation contract
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify public repository contract
        run: make public-docs-check
      - name: Verify explicit host toolchain bootstrap contract
        run: make ci-toolchain-contract
      - name: Verify authoritative Solana workflow contract
        run: make solana-conformance-workflow-contract

  integration:
    name: Docker quote and idempotency integration
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Run isolated Docker integration checks
        run: |
          set -o pipefail
          mkdir -p test-results/local-stack-integration
          ./scripts/verify_local_stack.sh 2>&1 | tee test-results/local-stack-integration/evidence.txt
      - name: Upload Docker integration evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: local-stack-integration-${{ github.run_id }}
          path: test-results/local-stack-integration/
          if-no-files-found: error
          retention-days: 14

  indexer-replay:
    name: Automated indexer replay recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Run two-replica replay recovery drill
        run: make indexer-replay-drill
      - name: Upload replay recovery evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: indexer-replay-${{ github.run_id }}
          path: test-results/indexer-replay/
          if-no-files-found: warn
          retention-days: 14

  refund-proof:
    name: Transaction-bound refund proof integration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Run transaction-bound proof-worker drill
        run: |
          mkdir -p test-results/refund-proof-integration
          make refund-proof-integration-drill | tee test-results/refund-proof-integration/evidence.txt
      - name: Upload transaction-bound proof evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: refund-proof-integration-${{ github.run_id }}
          path: test-results/refund-proof-integration/
          if-no-files-found: warn
          retention-days: 14

  indexer-replay-dead-letter:
    name: Indexer replay retry exhaustion
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Run two-replica retry-exhaustion drill
        run: make indexer-replay-dead-letter-drill
      - name: Upload retry-exhaustion evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: indexer-replay-dead-letter-${{ github.run_id }}
          path: test-results/indexer-replay-dead-letter/
          if-no-files-found: warn
          retention-days: 14

  alert-delivery:
    name: Alertmanager delivery contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Run Prometheus to Alertmanager delivery drill
        run: make alert-delivery-drill
      - name: Upload alert delivery evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: alert-delivery-${{ github.run_id }}
          path: test-results/alert-delivery/
          if-no-files-found: warn
          retention-days: 14

  refund-funding-verifier:
    name: Lease-fenced refund-funding verifier drill
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Run two-replica contention and crash-reclaim drill
        env:
          REFUND_FUNDING_VERIFIER_EVIDENCE_DIR: test-results/refund-funding-verifier
        run: make refund-funding-verifier-drill
      - name: Upload verifier evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: refund-funding-verifier-${{ github.run_id }}
          path: test-results/refund-funding-verifier/
          if-no-files-found: warn
          retention-days: 14

  refund-proof-lease:
    name: Lease-fenced refund-proof candidate ownership drill
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Run concurrent claim, stale reclaim, and dead-letter drill
        run: |
          mkdir -p test-results/refund-proof-lease
          make refund-proof-lease-drill | tee test-results/refund-proof-lease/evidence.txt
      - name: Upload refund-proof lease evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: refund-proof-lease-${{ github.run_id }}
          path: test-results/refund-proof-lease/
          if-no-files-found: warn
          retention-days: 14

  refund-execute-api-contention:
    name: Authenticated refund-execute API contention drill
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Run concurrent authenticated execute-preparation drill
        run: |
          mkdir -p test-results/refund-execute-api-contention
          make refund-execute-api-contention-drill | tee test-results/refund-execute-api-contention/evidence.txt
      - name: Upload execute API contention evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: refund-execute-api-contention-${{ github.run_id }}
          path: test-results/refund-execute-api-contention/
          if-no-files-found: warn
          retention-days: 14

  quote-load:
    name: Bounded quote-service load evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Run the declared local workload
        run: |
          mkdir -p test-results/quote-load
          BENCHMARK_RESOURCE_PROFILE_OUTPUT=test-results/quote-load/resource-profile.ndjson \
            make benchmark-quote-service | tee test-results/quote-load/evidence.txt
      - name: Upload quote-service evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quote-load-${{ github.run_id }}
          path: test-results/quote-load/
          if-no-files-found: warn
          retention-days: 14

  document-quote-load:
    name: Bounded document-quote service load evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Run the declared document workload
        run: |
          mkdir -p test-results/document-quote-load
          BENCHMARK_RESOURCE_PROFILE_OUTPUT=test-results/document-quote-load/resource-profile.ndjson \
            make benchmark-document-quote-service | tee test-results/document-quote-load/evidence.txt
      - name: Upload document-quote evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: document-quote-load-${{ github.run_id }}
          path: test-results/document-quote-load/
          if-no-files-found: warn
          retention-days: 14

  rule-simulation-load:
    name: Bounded persisted-rule simulation latency evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Run the declared local workload
        run: |
          mkdir -p test-results/rule-simulation-load
          make benchmark-rule-simulation | tee test-results/rule-simulation-load/evidence.txt
      - name: Upload persisted-rule simulation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rule-simulation-load-${{ github.run_id }}
          path: test-results/rule-simulation-load/
          if-no-files-found: warn
          retention-days: 14

  postgres-recovery:
    name: PostgreSQL logical backup and restore drill
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Run isolated PostgreSQL recovery drill
        run: make backup-restore-drill

  postgres-encrypted-recovery:
    name: PostgreSQL encrypted backup artifact drill
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Run encrypted backup and integrity restore drill
        run: |
          set -o pipefail
          mkdir -p test-results/encrypted-backup
          make encrypted-backup-restore-drill | tee test-results/encrypted-backup/evidence.txt
      - name: Upload encrypted backup evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: encrypted-backup-${{ github.run_id }}
          path: test-results/encrypted-backup/
          if-no-files-found: warn
          retention-days: 14

  projection-recovery:
    name: Indexer projection rebuild drill
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Run clean projection rebuild drill
        run: make projection-rebuild-drill

  vault-reconciliation:
    name: Scheduled vault reconciliation drill
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Run scheduled RPC-to-indexer reconciliation drill
        run: make vault-reconciliation-drill

  rpc-failover:
    name: Multi-provider RPC failover drill
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Run two-provider RPC failover reconciliation drill
        env:
          VAULT_RECONCILIATION_PROVIDER_MODE: failover
        run: make vault-reconciliation-drill

  postgres-contention:
    name: PostgreSQL contention and timeout drill
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Run bounded PostgreSQL contention drill
        run: make postgres-contention-drill

  postgres-pool:
    name: PostgreSQL pool saturation drill
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Run constrained pool and idempotency load
        run: make postgres-pool-drill

  postgres-index-plan:
    name: PostgreSQL evidence index-plan drill
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Run synthetic evidence-volume plan assertions
        run: make postgres-index-plan-drill

  postgres-pitr:
    name: PostgreSQL point-in-time recovery drill
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Run physical base-backup and WAL replay drill
        run: make postgres-pitr-drill

  migration-integrity:
    name: Versioned migration integrity drill
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Run checksum and advisory-lock migration drill
        run: make migration-integrity-drill

  migration-rollback:
    name: Expand/contract migration rollback rehearsal
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Run pre-deploy restore and forward-recovery rehearsal
        run: |
          set -o pipefail
          mkdir -p test-results/migration-rollback
          make migration-rollback-rehearsal | tee test-results/migration-rollback/evidence.txt
      - name: Upload migration rollback evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: migration-rollback-${{ github.run_id }}
          path: test-results/migration-rollback/
          if-no-files-found: warn
          retention-days: 14
