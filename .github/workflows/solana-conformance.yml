name: Solana conformance evidence

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  solana-conformance:
    name: Authoritative Linux validator evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Assert authoritative Linux validator runner
        run: |
          test "$(uname -s)" = Linux
          test "$(docker info --format '{{.OSType}}')" = linux
          case "$(docker info --format '{{.Architecture}}')" in
            amd64|x86_64) ;;
            *) echo "unsupported Docker architecture" >&2; exit 1 ;;
          esac

      - name: Retain authoritative host preflight
        run: ./scripts/verify_solana_conformance_host.sh

      - name: Run validator-backed conformance
        env:
          SOLANA_USE_DOCKER_BUILDER: true
        run: make solana-conformance

      - name: Verify validator conformance evidence
        if: always()
        run: ./scripts/verify_solana_conformance_evidence.sh

      - name: Upload validator conformance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: solana-conformance-${{ github.run_id }}-${{ github.sha }}
          path: test-results/solana-conformance/
          if-no-files-found: error
          retention-days: 30
