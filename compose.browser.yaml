services:
  postgres:
    ports: !reset []
  api:
    ports: !reset []
  auth-service:
    # The browser suite uses the local-only credential harness for synthetic
    # bearer values and must not claim the developer's host auth port.
    ports: !reset []
  edge:
    ports: !reset []
    build:
      args:
        # The live entrypoint is the admin control plane. Keep browser coverage
        # on the same email-OTP configuration as the documented local product.
        VITE_LOCAL_UI_MODE: email-otp
        VITE_AUTH_SERVICE_BASE_URL: http://auth-service:8085
